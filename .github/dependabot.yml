version: 2

# Dependabot : surveille les deux app (player + admin) et les actions CI.
# Regroupe les patches pour ne pas noyer la review sous des PRs unitaires.

updates:
  - package-ecosystem: "npm"
    directory: "/player"
    schedule:
      interval: "weekly"
    groups:
      patch-and-minor:
        update-types: ["patch", "minor"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/admin"
    schedule:
      interval: "weekly"
    groups:
      patch-and-minor:
        update-types: ["patch", "minor"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
