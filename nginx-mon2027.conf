# nginx site config for mon2027.fr — placed in /opt/docker/nginx/conf.d/
# Step 1 of deploy: HTTP-only block to serve the ACME challenge, so that
# certbot can issue the cert. The 443 block is added once the cert exists.

server {
    listen 80;
    server_name mon2027.fr www.mon2027.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mon2027.fr$request_uri;
    }
}
