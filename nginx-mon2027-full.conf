# mon2027.fr — config nginx complète (HTTP + HTTPS).
# Player sur /, espace contributeurs (admin) sur /admin. L'admin gère sa propre
# authentification (comptes individuels) : pas de Basic-Auth nginx.

server {
    listen 80;
    server_name mon2027.fr www.mon2027.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mon2027.fr$request_uri;
    }
}

# Force www → apex en HTTPS.
server {
    listen 443 ssl;
    server_name www.mon2027.fr;

    ssl_certificate /etc/letsencrypt/live/mon2027.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mon2027.fr/privkey.pem;

    return 301 https://mon2027.fr$request_uri;
}

server {
    listen 443 ssl;
    server_name mon2027.fr;

    ssl_certificate /etc/letsencrypt/live/mon2027.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mon2027.fr/privkey.pem;

    include /etc/nginx/security-rules.conf;

    # En-têtes de sécurité : posés par les applis elles-mêmes (next.config.ts
    # du player et de l'admin, réglés pour chacune). Le nginx partagé en pose
    # aussi au niveau http (nginx.conf, génériques pour tous les sites du
    # serveur) : ils arrivaient EN DOUBLE et en contradiction (deux CSP, deux
    # HSTS, X-Frame-Options DENY puis SAMEORIGIN). Tout add_header déclaré ici
    # coupe l'héritage de ceux du niveau http : on n'en garde qu'un, utile.
    # X-XSS-Protection « 0 » est la recommandation actuelle (le filtre XSS des
    # anciens navigateurs ouvrait lui-même des failles).
    add_header X-XSS-Protection "0" always;

    # Taille max d'un corps de requête. Le plus gros envoi légitime du player
    # est la progression synchronisée (≤ 512 Ko côté code, quelques dizaines
    # de Ko en pratique, ré-encodée en JSON) ; le reste tient en quelques Ko.
    # Coupe en amont les envois géants avant qu'ils n'atteignent Next.
    client_max_body_size 1m;

    # Résolution du conteneur à chaque requête via le DNS interne de Docker
    # (127.0.0.11). Avec un nom en dur dans proxy_pass, nginx fige l'IP au
    # chargement de la conf : chaque recréation du player (déploiement) lui
    # donne une nouvelle IP et le site tombe en 502 jusqu'au prochain reload
    # (incident du 2026-11-07). Bonus : nginx accepte de charger la conf même
    # si le conteneur n'existe pas encore, au lieu de bloquer tous les sites.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mon2027_player http://prod_mon2027_player:3000;
    set $mon2027_admin http://prod_mon2027_admin:3001;

    # /admin/* → admin (basePath /admin appliqué dans Next).
    location /admin {
        # Formulaires de question (textes longs, sources) : marge plus large.
        client_max_body_size 2m;
        proxy_pass $mon2027_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pas d'add_header ici : il annulerait celui hérité du bloc server.
        # L'admin pose lui-même ses en-têtes de sécurité, noindex et no-store.
    }

    # Tout → player container.
    location / {
        proxy_pass $mon2027_player;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
